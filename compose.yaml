# PostgreSQL only; Python runs on the host with uv during M5.
name: casetrace-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_ADMIN_PASSWORD:?Set the admin password in .env}
      CASETRACE_POSTGRES_PASSWORD: ${CASETRACE_POSTGRES_PASSWORD:?Set the app password in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${CASETRACE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$CASETRACE_POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U casetrace -d casetrace_test -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 128mb

volumes:
  postgres_data:

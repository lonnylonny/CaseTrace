[project]
name = "casetrace"
version = "0.1.0"
description = "AI-assisted historical case retrieval for technical incident investigation"
readme = "README.md"
authors = [
    { name = "lonny", email = "lonnydai0127@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "rank-bm25>=0.2.2,<0.3",
]

[project.scripts]
casetrace = "casetrace:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
